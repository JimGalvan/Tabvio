<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northwind Outfitters — Your cart</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1b2733; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 12px 24px; border-bottom: 1px solid #dde3e9; }
  .brand { font-weight: 700; letter-spacing: 0.02em; }
  .cart-link { text-decoration: none; color: #1b2733; }
  main { max-width: 760px; margin: 0 auto; padding: 24px; }
  .code { font-family: monospace; font-weight: 700; }
  .muted { color: #5d7180; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  td, th { text-align: left; padding: 10px 4px; border-bottom: 1px solid #eef1f4; }
  td.amount, th.amount { text-align: right; }
  .total-row td { font-weight: 700; border-bottom: 0; }
  .thumb { display: inline-block; width: 44px; height: 44px; border-radius: 6px;
           vertical-align: middle; margin-right: 10px;
           background: linear-gradient(140deg, #2b4a63, #6f97b5); }
  select { font-size: 0.95rem; padding: 4px; }
  button { font-size: 1rem; padding: 10px 20px; cursor: pointer;
           color: white; background: #1c64f2; border: 0; border-radius: 6px; }
  .actions { display: flex; justify-content: space-between; align-items: center;
             margin-top: 24px; }
  .empty { padding: 24px; background: #f5f7f9; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <span class="brand">NORTHWIND OUTFITTERS</span>
  <a class="cart-link" id="nav-cart" href="cart.html">Cart (<span id="cart-count">0</span>)</a>
</header>

<main>
  <p class="muted">Step 2 of 5 — Cart. Page code: <span class="code" id="page-code">SHOP-CART-9X7</span></p>
  <h1>Your cart</h1>

  <div id="cart-empty" class="empty" hidden>
    <p id="empty-message">Your cart is empty.</p>
    <p><a id="empty-to-product" href="product.html">Back to the Trailhead Running Shoe</a></p>
  </div>

  <div id="cart-filled" hidden>
    <table>
      <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th class="amount">Price</th>
      </tr>
      <tr>
        <td>
          <span class="thumb" aria-hidden="true"></span>
          <span id="line-name">Trailhead Running Shoe</span>
          <span class="muted" id="line-size"></span>
        </td>
        <td>
          <label class="muted" for="cart-quantity">Quantity</label>
          <select id="cart-quantity" name="quantity">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </td>
        <td class="amount" data-total="subtotal">$0.00</td>
      </tr>
      <tr>
        <td colspan="2">Shipping</td>
        <td class="amount" data-total="shipping">$0.00</td>
      </tr>
      <tr>
        <td colspan="2">Estimated tax</td>
        <td class="amount" data-total="tax">$0.00</td>
      </tr>
      <tr class="total-row">
        <td colspan="2">Order total</td>
        <td class="amount" data-total="total">$0.00</td>
      </tr>
    </table>

    <div class="actions">
      <a id="cart-to-product" href="product.html">Keep shopping</a>
      <button id="checkout-button" type="button">Proceed to checkout</button>
    </div>
  </div>
</main>

<script src="shop.js"></script>
<script>
  var cart = Shop.readCart();

  if (!cart) {
    document.getElementById('cart-empty').hidden = false;
  } else {
    document.getElementById('cart-filled').hidden = false;
    document.getElementById('line-name').textContent = cart.name;
    document.getElementById('line-size').textContent = 'Size ' + cart.size;
    document.getElementById('cart-quantity').value = String(cart.quantity);
    Shop.paintTotals(cart);
  }

  Shop.paintCartCount();

  document.getElementById('cart-quantity').addEventListener('change', function (event) {
    cart.quantity = Number(event.target.value);
    Shop.saveCart(cart);
    Shop.paintTotals(cart);
    Shop.paintCartCount();
  });

  document.getElementById('checkout-button').addEventListener('click', function () {
    window.location.href = 'shipping.html';
  });
</script>

</body>
</html>
