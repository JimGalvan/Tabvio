<!doctype html>
<meta charset="utf-8">
<title>Pay for your order</title>
<h1>Payment</h1>
<form>
  <label>Name on card <input autocomplete="cc-name" name="holder"></label>
  <label>Card number <input autocomplete="cc-number" inputmode="numeric"></label>
  <label>Expiry <input autocomplete="cc-exp" placeholder="MM/YY"></label>
  <label>Security code <input autocomplete="cc-csc" inputmode="numeric"></label>
  <button type="submit">Place order</button>
</form>
