[tool.uv.workspace]
members = ["packages/tabvio-agent"]

[tool.pytest.ini_options]
testpaths = ["packages/tabvio-agent/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
extend-exclude = ["notebooks"]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "E402"]

[tool.ruff.lint.per-file-ignores]
"packages/tabvio-agent/src/tabvio_agent/browser/page_content.py" = ["UP035"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "notebook>=7.6.2",
    "pytest>=8.0.0,<9.0.0",
    "python-dotenv",
    "ruff>=0.15.17",
]
