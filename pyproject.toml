[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tabvio*"]

[tool.setuptools.package-data]
"tabvio.browser" = ["scripts/*.js"]
"tabvio.server" = ["static/*"]

[project]
name = "tabvio"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"

dependencies = [
    "strands-agents[openai,otel]>=1.55,<2.0",
    "bedrock-agentcore>=1.22,<2.0",
    "python-dotenv",
    "tavily-python",
    "markdown",
    "nh3",
    "matplotlib>=3.11.0",
    "questionary>=2.0.0",
    "fastapi>=0.116.0,<1.0",
    "uvicorn[standard]>=0.35.0,<1.0",
    "playwright>=1.59.0,<2.0",
    "workos>=5.10",
    "cryptography>=43.0",
]

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "E402"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "notebook>=7.6.2",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.15.17",
]
