[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tabvio*"]

[tool.setuptools.package-data]
"tabvio.server" = ["static/*"]

[project]
name = "tabvio"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"

dependencies = [
    "python-dotenv",
    "markdown",
    "nh3",
    "fastapi>=0.116.0,<1.0",
    "uvicorn[standard]>=0.35.0,<1.0",
    "workos>=5.10",
    "cryptography>=43.0",
    "pydantic>=2.0,<3.0",
    "starlette>=0.40.0,<1.0",
    "tabvio-agent",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tabvio-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/tabvio-agent/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
extend-exclude = ["notebooks"]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "E402"]

[tool.ruff.lint.per-file-ignores]
"packages/tabvio-agent/src/tabvio_agent/browser/page_content.py" = ["UP035"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "notebook>=7.6.2",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.15.17",
]
