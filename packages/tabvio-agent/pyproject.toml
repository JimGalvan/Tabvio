[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabvio-agent"
version = "0.1.0"
description = "An event-driven browser agent built with LangChain, deepagents, and Playwright."
readme = { text = "See the [repository README](https://github.com/JimGalvan/Tabvio/blob/master/README.md) for an overview and development instructions.", content-type = "text/markdown" }
license = "Apache-2.0"
keywords = ["browser", "automation", "agent", "langchain", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.25,<0.8",
    "langgraph>=1.2.15,<2.0",
    "langchain>=1.4.6,<2.0",
    "langchain-core>=1.6.10,<2.0",
    "langchain-openai>=1.7.2,<2.0",
    "langchain-quickjs>=0.3.9,<0.4",
    "playwright>=1.59.0,<2.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/JimGalvan/Tabvio"
Repository = "https://github.com/JimGalvan/Tabvio"
Issues = "https://github.com/JimGalvan/Tabvio/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tabvio_agent*"]

[tool.setuptools.package-data]
"tabvio_agent.browser" = ["scripts/*.js"]
"tabvio_agent.browser_agent" = ["skills/**/*"]
